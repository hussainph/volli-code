packages:
  - apps/*
  - packages/*

# Hard-fail `pnpm install` when the running Node is outside the root
# `engines.node` pin (^24.13.0). Without this, an install under a stray older
# Node (a machine's /usr/local/bin/node beside Homebrew's current, say)
# succeeds and quietly builds native modules against the wrong ABI — the
# desktop app then boots into a dead database with sign-in greyed out (VC-76).
# CI installs under the pinned Node (node-version-file: package.json), so this
# only ever bites the machine it is protecting.
engineStrict: true

# Successor to onlyBuiltDependencies (pnpm 11): true = allowed to run build scripts.
# electron@43 ships no lifecycle scripts (its binary comes from a require-time
# fetch), but pnpm 11 still hard-fails install (ERR_PNPM_IGNORED_BUILDS) without
# this entry — do not remove it.
allowBuilds:
  # Transitive under @earendil-works/pi-ai (Google provider). Neither build
  # script is needed for the SDK paths the Agent Runtime uses.
  "@google/genai": false
  better-sqlite3: true
  electron: true
  # Windows Squirrel tooling pulled in by electron-builder; we only build the
  # macOS dmg target, so its install-time script never needs to run.
  electron-winstaller: false
  esbuild: true
  # Native addons are initially compiled against the system Node ABI. The
  # desktop package's postinstall rebuilds them for Electron's ABI.
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: true

catalog:
  "@types/node": ^26.3.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  typescript: ~7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.3.0
  # Must match the vitest bundled in vite-plus (vp fails fast on version
  # skew) — bump in lockstep with the vite-plus pin above.
  "@vitest/coverage-v8": 4.1.11

# Supply-chain guard: refuse to install any version published within this many
# minutes (relaxed from the vp default of 1440 = 24h). 60m still blocks the
# highest-risk same-hour window a compromised publish lands in, but no longer
# stalls day-old Dependabot bugfix bumps behind the 24h clock. Bump specific
# pins into the exclude list below when a fresh release must land immediately.
minimumReleaseAge: 60

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.2.5"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.5"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.5"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.5"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.5"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.5"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.5"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.5"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.5"
  - vite-plus@0.2.5
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - typescript@7.0.2
  - astro@7.1.1
  - miniflare@4.20260714.0
  - wrangler@4.112.0

overrides:
  vite: "catalog:"
  # One shiki 4 in the tree, ever. streamdown's dist types import bare "shiki"
  # and resolve whatever pnpm's hidden hoist holds — when a transitive range
  # (docs-site expressive-code) re-resolved to 4.4.3 beside the app's 4.3.1,
  # incrementally-updated checkouts hoisted 4.4.3 and typecheck broke against
  # @streamdown/code's shiki-3 types while fresh CI installs stayed green.
  # Remove when shiki 4.4+ is retaken deliberately (see PR #246's thread).
  "shiki@^4": "4.3.1"

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@dnd-kit/core@6.3.1": patches/@dnd-kit__core@6.3.1.patch
  # TEMPORARY — delete this patch, and the file it points at, the moment either
  # Pi ships `glm-5.3-flash` itself or VC-135 lands a runtime catalogue refresh.
  # It adds one model (opencode-go/glm-5.3-flash, live on the Go gateway since
  # 2026-08-26 and absent from every published pi through 0.84.3) to
  # `dist/providers/data/opencode-go.json`, because that catalogue is generated
  # at pi publish time and is the only way to make the model selectable.
  #
  # VC-135 rejects patching as a durable strategy and it is right: 26 of pi's 39
  # provider data files churned in the 0.84.2 -> 0.84.3 *patch* bump alone, so
  # this patch will need rebasing at essentially every Pi release, and a rebase
  # that silently fails costs us the model. It is carried only as VC-135's own
  # named exception — "a reasonable same-day escape hatch if one specific model
  # is urgently needed" — and it expires as soon as that stops being true.
  #
  # Note the catalogue is a *build-time* input: it is inlined into
  # apps/desktop/dist-electron/main.cjs, and electron-builder.yml's `files`
  # whitelist excludes @earendil-works from node_modules entirely. This patch
  # takes effect at install -> build, so the app must be rebuilt before the
  # model is selectable. Editing JSON on disk in a packaged app does nothing.
  "@earendil-works/pi-ai@0.84.3": patches/@earendil-works__pi-ai@0.84.3.patch
  restty@0.2.0: patches/restty@0.2.0.patch

peerDependencyRules:
  allowAny:
    - vite
