# Packaging config for macOS builds: `pnpm -C apps/desktop run dist`
# (vp build/pack first, then electron-builder). Output lands in release/
# (gitignored).
#
# Signing posture (VC-23): electron-builder signs with the Developer ID
# Application identity it finds in the login keychain (or via CSC_NAME /
# CSC_LINK+CSC_KEY_PASSWORD in CI) — hardened runtime with
# build/entitlements.mac.plist. Notarization runs when credentials are in the
# env: APPLE_API_KEY (path to .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER
# (App Store Connect API key, preferred) or APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID. Credentials live only in env /
# CI secrets, never in the repo. Without a cert and credentials the build
# falls back to ad-hoc signing and skips notarization — fine for a personal
# machine, but Squirrel.Mac auto-updates and Gatekeeper on other machines
# require the full Developer ID + notarization path.
appId: app.volli.desktop
# productName comes from package.json ("Volli Code"); the .app icon comes from
# buildResources (build/icon.icns — canonical baked asset, never regenerated).
directories:
  output: release
  buildResources: build

# The app payload is exactly what `pnpm start` runs: the packed main/preload
# (dist-electron/, including the volli-cli.cjs bundle copy-cli.mjs drops there)
# and the built renderer (dist/, served from volli-app://bundle/). Production
# node_modules are collected separately by electron-builder from package.json
# dependencies — but vp pack bundles almost everything into the dist-electron
# chunks (all @volli/* source and, with it, their third-party deps), and vite
# compiles every renderer dep into dist/. What the packaged main process
# require()s from node_modules at runtime is therefore a tiny closed set:
#   @trpc/server, better-sqlite3 (-> bindings -> file-uri-to-path), node-pty
# (node-pty via a lazy `import("node-pty")`), sharp (and its platform-native
# `@img` binary/libvips packages, loaded lazily by the read-image processor —
# see the optionalDependencies note below), yaml (prompt-template
# frontmatter), jsdom + its runtime tree (@asamuzakjp, @bramus, @csstools,
# @exodus, bidi-js, css-tree, data-urls, decimal.js, entities,
# html-encoding-sniffer, is-potential-custom-element-name, lru-cache, mdn-data,
# parse5, punycode, require-from-string, saxes, source-map-js, symbol-tree,
# tldts, tldts-core, tough-cookie, tr46, undici, w3c-xmlserializer,
# webidl-conversions, whatwg-mimetype, whatwg-url, xml-name-validator,
# xmlchars — jsdom reads files relative to its own package layout at module
# load, so it is neverBundle'd rather than bundled; bidi-js is imported at
# module load by @asamuzakjp/dom-selector, whose absence shipped the
# canary.7 boot crash), @vscode/ripgrep (VC-193: find-across-files, kept
# external for jsdom's reason — its whole body resolves a path relative to its
# own package — plus its platform binary package, see the optionalDependencies
# note below), and
# electron-updater (VC-24) with its own runtime tree
# (builder-util-runtime -> debug -> ms, sax; fs-extra -> graceful-fs,
# jsonfile, universalify; js-yaml -> argparse; lazy-val; lodash.escaperegexp;
# lodash.isequal; semver; tiny-typed-emitter). The extglob negation below drops
# the other ~500 collected packages (~400 MB: monaco, mermaid, icon packs, AI
# SDK providers — all renderer-only or already bundled). KEEP IN SYNC with the
# bare `require(`/`import(` specifiers in dist-electron/*.cjs: a new external
# main-process dep must be added here or the packaged app fails at launch
# while `pnpm start` keeps working.
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - "!node_modules/!(@asamuzakjp|@bramus|@csstools|@exodus|@img|@trpc|@vscode|argparse|better-sqlite3|bidi-js|bindings|builder-util-runtime|css-tree|data-urls|debug|decimal.js|detect-libc|electron-updater|entities|file-uri-to-path|fs-extra|graceful-fs|html-encoding-sniffer|is-potential-custom-element-name|js-yaml|jsdom|jsonfile|lazy-val|lodash.escaperegexp|lodash.isequal|lru-cache|mdn-data|ms|node-pty|parse5|punycode|require-from-string|sax|saxes|semver|sharp|source-map-js|symbol-tree|tiny-typed-emitter|tldts|tldts-core|tough-cookie|tr46|undici|universalify|w3c-xmlserializer|webidl-conversions|whatwg-mimetype|whatwg-url|xml-name-validator|xmlchars|yaml)/**"
  - "!node_modules/@trpc/!(server)/**"
  # Dev-only artifacts inside kept modules: deps/ is better-sqlite3's vendored
  # SQLite source, prebuilds/ is the Node-ABI cache that cache-node-sqlite.mjs
  # maintains for plain-Node tests. The packaged app loads only the
  # Electron-ABI build/Release binary.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/prebuilds/**"

# Native modules ship exactly as rebuild:native left them (Electron ABI in
# build/Release). electron-builder must not run its own rebuild pass — that
# would fight the repo's Node-ABI/Electron-ABI coexistence scheme.
npmRebuild: false

# sharp reaches its native binding through a two-link chain of OPTIONAL
# dependencies: sharp -> @img/sharp-darwin-arm64 (the .node addon) ->
# @img/sharp-libvips-darwin-arm64 (the libvips-cpp dylib the addon dlopen()s by
# @rpath). electron-builder's pnpm collector does not follow a transitive
# optional platform package — its own log calls this "platform-specific optional
# dependencies not bundled — add them to your project's optionalDependencies",
# and pnpm 10+ does not preserve them across a lockfile regeneration either.
# Whitelisting `@img` above is necessary but NOT sufficient. BOTH links are
# therefore listed in apps/desktop/package.json's optionalDependencies, and both
# must be bumped in lockstep with the `sharp` pin.
#
# Getting this wrong is quiet, which is why it is spelled out. Miss the first
# link and the app ships sharp's JavaScript and no binary; miss the second and it
# ships the addon but no dylib. Either way `require("sharp")` throws "Could not
# load the sharp module using the darwin-arm64 runtime" — and because the
# read-image processor catches that and degrades, the only symptom is that every
# image read in the packaged app returns "[Image omitted]" while `pnpm start`,
# which resolves through the pnpm store, keeps working perfectly.
#
# They are optionalDependencies rather than plain ones so Linux CI, which
# installs the same workspace, skips them on `os`/`cpu` instead of failing.
# arm64-only mirrors the mac target below; an Intel or universal target needs
# `@img/sharp-darwin-x64` + `@img/sharp-libvips-darwin-x64` beside them.
#
# `@vscode/ripgrep-darwin-arm64` is listed there for exactly the same reason
# and behaves the same way (VC-193): `@vscode/ripgrep` reaches its `rg` binary
# through an optional per-platform package, which the pnpm collector would not
# follow on its own. Miss it and `volli:search` reports "Search is unavailable"
# in the packaged app while `pnpm start` keeps finding matches.

# Native modules cannot load from inside an asar; node-pty also exec()s its
# sibling spawn-helper binary, and sharp loads native bindings plus libvips from
# its `@img` packages, so all of those trees stay unpacked wholesale.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/node-pty/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  # An executable cannot be spawned from inside an asar, and `rg` is one. The
  # whole @vscode tree is unpacked rather than just `bin/`: the resolver that
  # names the binary is `@vscode/ripgrep`'s own ES module, and keeping the two
  # halves on the same side of the archive is what makes the runtime import
  # find the file it then reports.
  - "**/node_modules/@vscode/**"

electronLanguages:
  - en

mac:
  category: public.app-category.developer-tools
  # Hardened runtime is a notarization requirement. The entitlements file is
  # our own minimal set (see comments in it); the same file applies to the
  # nested Electron helpers via entitlementsInherit.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Boolean in electron-builder 26: notarizes when the APPLE_* env credentials
  # above are present, warns and skips when they are not (so credential-less
  # local builds keep working).
  notarize: true
  # dmg is the human download; zip is what Squirrel.Mac/electron-updater
  # consumes (VC-24) — a dmg alone cannot drive auto-updates. arm64-only by
  # decision; no Intel builds for now.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

# electron-builder notarizes/staples the .app but not the dmg artifact
# itself; this hook gives the dmg its own ticket so `stapler validate`
# passes and Gatekeeper can verify the download offline (VC-23 acceptance).
# No-op when the APPLE_API_* env vars are absent — see the script header.
afterAllArtifactBuild: scripts/staple-dmg.mjs

# GitHub Releases is the distribution channel. electron-builder only uploads
# when invoked with --publish and a GH_TOKEN (the release workflow's job,
# VC-25); this block's presence also makes builds emit latest-mac.yml next to
# the artifacts, which electron-updater (VC-24) needs on the release.
publish:
  provider: github
  owner: hussainph
  repo: volli-code
