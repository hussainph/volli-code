<!doctype html>
<!-- No mode class here on purpose. Preload stamps `light` or `dark` on this
     element before any page script runs, from the hint main resolved at window
     construction (see `stampFirstPaintAppearance` in src/preload/index.ts) — a
     media query would only know the SYSTEM, and an inline script is blocked by
     the CSP below. With neither class, globals.css's `:root` block renders
     dark, exactly as the old pin did. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Volli Code</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: volli-blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
