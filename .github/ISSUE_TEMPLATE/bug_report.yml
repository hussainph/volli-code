name: Bug report
description: Something in Volli doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a ticket
        2. Start a chat
        3. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Volli version
      description: Shown in Settings → Updates.
      placeholder: 0.3.0-canary.8
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps. Remove secrets, tokens, and private paths first.
    validations:
      required: false
