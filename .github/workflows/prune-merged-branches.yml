name: Prune merged branches

# Deletes remote branches that are fully merged into main and whose newest
# commit is older than MIN_AGE_DAYS, so the branch list stays readable without
# removing a branch someone may still be looking at. A branch with an open pull
# request is never deleted, and an unmerged branch is never touched. Every
# deleted branch's commits are already on main.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true
      min_age_days:
        description: "Only delete branches whose newest commit is at least this many days old"
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    name: Prune merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete merged branches older than the minimum age
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MIN_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_age_days || 10 }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          cutoff=$(( $(date +%s) - MIN_AGE_DAYS * 86400 ))
          gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName' \
            | sort -u > open-pr-heads.txt

          : > candidates.txt
          git for-each-ref refs/remotes/origin --merged origin/main \
            --format='%(committerdate:unix) %(refname:lstrip=3)' |
          while read -r committed branch; do
            case "$branch" in main | HEAD) continue ;; esac
            [ "$committed" -lt "$cutoff" ] || continue
            grep -qxF "$branch" open-pr-heads.txt && continue
            echo "$branch" >> candidates.txt
          done

          count=$(wc -l < candidates.txt | tr -d ' ')
          echo "Merged branches older than ${MIN_AGE_DAYS} days with no open PR: ${count}"
          {
            echo "### Prune merged branches"
            echo ""
            echo "Minimum age: ${MIN_AGE_DAYS} days. Dry run: ${DRY_RUN}. Branches: ${count}."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ] || exit 0

          if [ "$DRY_RUN" = "true" ]; then
            sed 's/^/would delete: /' candidates.txt
            exit 0
          fi

          # One push deletes a batch of refs; keep batches small enough for the
          # remote to accept in one request.
          xargs -n 50 sh -c 'git push origin --delete "$@"' _ < candidates.txt
