name: Smoke quarantine

# Non-gating observation lane, not deleted coverage. Repeat-flake threshold,
# evidence and return criteria: docs/research/smoke-flakes-2026-10.md and
# docs/research/smoke-suite-policy.md. Each entry has a Backlog fix ticket.
# A smoke red is visible in the summary/artifact but does not make this workflow
# red (or send failed-smoke emails). Infrastructure/build failures still do.
# Never include this workflow in CI gate or enable auto-merge here.
on:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:
    inputs:
      observe_picker:
        description: "Observe the restored automations picker with four concurrent fresh profiles"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-quarantine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quarantine:
    name: Quarantined smoke observations (non-gating)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build and fetch Electron
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Observe quarantined smokes (failure reported, not gating)
        id: observe
        continue-on-error: true
        env:
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-results
        run: node apps/desktop/scripts/smoke-quiet-check.mjs --assert-stationary-cursor --tier quarantine --jobs 4

      # VC-530's return proof must still execute the picker after its quarantine
      # entry is removed. Opt-in only; this does not change nightly membership.
      - name: Observe restored picker under concurrent startup (non-gating)
        if: ${{ inputs.observe_picker }}
        continue-on-error: true
        env:
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-results/picker-observation
        run: |
          node --test --test-concurrency="${VOLLI_CONCURRENCY_HINT:-1}" apps/desktop/e2e/automations-picker-observation.test.mjs
          node --input-type=module <<'NODE'
          import { join } from 'node:path';
          import { runOne } from './apps/desktop/scripts/run-smokes.mjs';
          import { createSmokeReporter, runWithRetry } from './apps/desktop/scripts/smoke-results.mjs';
          const name = 'automations-picker-smoke.mjs';
          const results = await Promise.all(Array.from({ length: 4 }, async (_, index) => {
            const reporter = createSmokeReporter({
              reportDir: join(process.env.VOLLI_SMOKE_REPORT_DIR, String(index + 1)),
              summaryPath: process.env.GITHUB_STEP_SUMMARY,
              names: [name],
              metadata: {
                tier: `picker-observation-${index + 1}`,
                runId: process.env.GITHUB_RUN_ID,
                runAttempt: process.env.GITHUB_RUN_ATTEMPT,
                sha: process.env.GITHUB_SHA,
                event: process.env.GITHUB_EVENT_NAME,
              },
            });
            try {
              const result = await runWithRetry(name, (name, number) => runOne(name, number, { reporter }));
              reporter.recordResult(result);
              console.log(`${result.status} ${name} profile ${index + 1}`);
              return result;
            } finally {
              reporter.finish();
            }
          }));
          // Retry-green is evidence of a remaining race, not a successful return proof.
          if (results.some(result => result.status !== 'PASS')) process.exitCode = 1;
          NODE

      - name: Mark non-gating observation outcome
        if: always()
        env:
          OUTCOME: ${{ steps.observe.outcome }}
        run: |
          echo "### Quarantine lane (non-gating): $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Probe failures are observations, not green assertions. See both-attempt artifacts and Backlog fix tickets VC-523–VC-526." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quarantine smoke attempts and native-window evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results-quarantine-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-results
          if-no-files-found: warn
          retention-days: 30
