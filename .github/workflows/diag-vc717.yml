# DIAGNOSTIC (VC-717) — TEMPORARY, never in the final diff.
# Before (main's test files) vs after (this branch's) for migrations.test.ts,
# on an idle runner disk and on a disk whose FLUSHES are slow — the condition
# the failing CI runs show (fsync-heavy tests 10-20x slower, CPU-bound ones not).
name: diag-vc717

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-vc717-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Diag migrations (flush delay ${{ matrix.flush_ms }} ms)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flush_ms: [0, 4, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fio strace >/dev/null
      - name: Scratch disk with slow flushes
        run: |
          uname -r
          if [ "${{ matrix.flush_ms }}" = "0" ]; then
            echo "SCRATCH=/tmp" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo modprobe dm-delay
          truncate -s 3G /tmp/slow.img
          loop=$(sudo losetup -f --show /tmp/slow.img)
          size=$(sudo blockdev --getsz "$loop")
          # reads: 0 ms, writes: 0 ms, flushes: N ms
          echo "0 $size delay $loop 0 0 $loop 0 0 $loop 0 ${{ matrix.flush_ms }}" | sudo dmsetup create slow
          sudo mkfs.ext4 -q /dev/mapper/slow
          sudo mkdir -p /mnt/slow && sudo mount /dev/mapper/slow /mnt/slow
          sudo chown "$(id -u):$(id -g)" /mnt/slow
          echo "SCRATCH=/mnt/slow" >> "$GITHUB_ENV"
      - name: Flush latency on the scratch disk
        run: fio --name=lat --directory="$SCRATCH" --rw=write --bs=4k --size=1m --fsync=1 | grep -A8 'fsync/fdatasync' || true
      - name: Before (main's test files) and after (this branch), x2 each
        working-directory: packages/host-core
        run: |
          git fetch -q --depth=1 origin main
          mkdir -p /tmp/out
          files="src/db/migrations.test.ts src/db/test-helpers.ts src/pty/park-controller.test.ts"
          for f in $files; do cp "$f" "/tmp/out/after-$(basename "$f")"; git show "origin/main:packages/host-core/$f" > "/tmp/out/before-$(basename "$f")"; done
          run() {
            label=$1
            for f in $files; do cp "/tmp/out/$label-$(basename "$f")" "$f"; done
            for rep in 1 2; do
              log=/tmp/out/$label-$rep.log
              TMPDIR=$SCRATCH vp test run src/db/migrations.test.ts --maxWorkers=1 --reporter=verbose > "$log" 2>&1 || true
              echo "=== $label rep $rep: $(grep -E '^ +Tests ' "$log" | tr -s ' ') / $(grep -E '^ +Duration' "$log" | tr -s ' ' | cut -d'(' -f1)"
              grep -E 'tidies the legacy table|kind index equal to the log after every|keeps a legacy table that holds rows|is idempotent on every shape|marks an existing profile|backfills commit order' "$log" \
                | sed -E 's/.*> ([^>]+)$/  \1/' || true
              grep -E 'Test timed out' "$log" | sort | uniq -c || true
            done
          }
          run before
          run after
      - name: fsync syscalls per test, before and after (strace)
        if: matrix.flush_ms == 0
        working-directory: packages/host-core
        run: |
          files="src/db/migrations.test.ts src/db/test-helpers.ts src/pty/park-controller.test.ts"
          for label in before after; do
            for f in $files; do cp "/tmp/out/$label-$(basename "$f")" "$f"; done
            for name in "tidies the legacy table a fork left beside both new ones" "keeps the kind index equal to the log after every migration"; do
              strace -f -c -e trace=fsync,fdatasync -o /tmp/strace.txt \
                vp test run src/db/migrations.test.ts --maxWorkers=1 -t "$name" > /tmp/one.log 2>&1 || true
              echo "=== $label: $name: $(grep -E '^ +Tests ' /tmp/one.log | tr -s ' ') fsyncs=$(awk '$NF=="fsync"{print $4}' /tmp/strace.txt)"
            done
            strace -f -c -e trace=fsync,fdatasync -o /tmp/strace.txt \
              vp test run src/db/migrations.test.ts --maxWorkers=1 > /tmp/one.log 2>&1 || true
            echo "=== $label: whole file: $(grep -E '^ +Tests ' /tmp/one.log | tr -s ' ') fsyncs=$(awk '$NF=="fsync"{print $4}' /tmp/strace.txt)"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-vc717-flush-${{ matrix.flush_ms }}-attempt-${{ github.run_attempt }}
          path: /tmp/out
          retention-days: 14
