# Temporary VC-717 measurement; removed before the final PR head.
name: diag-vc717
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: diag-vc717-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Diag split migration walk (8 ms flush delay)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOLLI_CONCURRENCY_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Scratch disk with slow flushes
        run: |
          sudo modprobe dm-delay
          truncate -s 3G /tmp/slow.img
          loop=$(sudo losetup -f --show /tmp/slow.img)
          size=$(sudo blockdev --getsz "$loop")
          echo "0 $size delay $loop 0 0 $loop 0 0 $loop 0 8" | sudo dmsetup create slow
          sudo mkfs.ext4 -q /dev/mapper/slow
          sudo mkdir -p /mnt/slow && sudo mount /dev/mapper/slow /mnt/slow
          sudo chown "$(id -u):$(id -g)" /mnt/slow
      - name: Before and after, two measured samples each
        working-directory: packages/host-core
        run: |
          base=1ca88d00a19df434c7fa10f2fe3c9e2197501dcd
          git fetch -q --depth=1 origin "$base"
          mkdir -p /tmp/out
          files="src/db/migrations.test.ts src/db/test-helpers.ts"
          for f in $files; do
            cp "$f" "/tmp/out/after-$(basename "$f")"
            git show "$base:packages/host-core/$f" > "/tmp/out/before-$(basename "$f")"
          done
          for label in before after; do
            for f in $files; do cp "/tmp/out/$label-$(basename "$f")" "$f"; done
            for sample in 1 2; do
              log=/tmp/out/$label-$sample.log
              status=0
              TMPDIR=/mnt/slow vp test run src/db/migrations.test.ts \
                --maxWorkers="$VOLLI_CONCURRENCY_HINT" --reporter=verbose \
                -t 'tidies the legacy table a fork left beside both new ones|keeps the kind index equal to the log after every migration' > "$log" 2>&1 || status=$?
              cat "$log"
              if [ "$label" = after ] && [ "$status" != 0 ]; then exit "$status"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-vc717-split-walk-attempt-${{ github.run_attempt }}
          path: /tmp/out
          retention-days: 14
