name: CI extended

# The lanes that left the PR gate (VC-934), kept rather than deleted: the rest
# smoke tier (every non-core, non-quarantined journey) and flag-on cloud
# acceptance, plus the move engine's kill/resume matrix and the large-profile
# backup restore rehearsal (both Linux). The smoke
# lanes are macOS-only and long, and gating every PR on them held
# all five of the account's concurrent macOS slots per PR run, so PRs queued
# behind each other. Here they run:
#   - on every push to main — the merged tree, after the PR gate;
#   - nightly, so a quiet day still gets a result;
#   - on demand for ANY branch: `gh workflow run ci-extended.yml --ref <branch>`.
#     A PR that changes a journey's area or the cloud path should dispatch it
#     before merge; its result shows on that commit;
#   - on a PR only when it changes this file or the smoke runner, so the lane
#     definition is proven by the PR that edits it (as ci.yml is).
#
# Results are visible, not gating: a red here is a red X on the commit and a
# failed `Extended result`, never a required PR check. The release workflow
# reads it — a commit is released only when this workflow AND CI succeeded on
# it. A red on main is a regression to triage (AGENTS.md, CI is the gate);
# measured repeat flakers belong in smoke-quarantine.yml, not in a re-run.
#
# The rest tier is ONE macOS job, not the three shards it was on PRs, and
# cloud acceptance waits for it rather than running beside it: here latency
# matters less than slots, so this workflow holds one macOS slot at a time
# (main's own core e2e in ci.yml holds a second), leaving the PR lanes three
# of the five. The runner still globs apps/desktop/e2e/*-smoke.mjs and subtracts
# core, credential/legacy exclusions and measured quarantine, so a new smoke
# joins this lane with no registration step. The small two-Mac cloud journey
# leads the chain so its failure reports before the long rest tier: that one
# job proves the wake path and, in the same slot and build, the Automation
# path (VC-1004). Every later lane still runs after a failure, and the summary
# requires all of them.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ci-extended.yml
      - apps/desktop/scripts/run-smokes.mjs
      - apps/desktop/scripts/smoke-quiet-check.mjs
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# On main, a RUNNING run is never cancelled — a lane this long, cancelled by
# every merge in a burst, would never report. GitHub keeps at most ONE queued
# run per group and replaces it with the newer commit's (the replaced one
# shows as cancelled on its commit, which the release guard therefore
# refuses), so a burst of merges costs one in-flight run plus one run of the
# newest commit. A PR's newer push does supersede its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-rest:
    name: Smoke (rest tier)
    needs: smoke-cloud-wake
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build and fetch Electron
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run the rest tier and verify quiet native windows
        env:
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-results
        run: node apps/desktop/scripts/smoke-quiet-check.mjs --assert-stationary-cursor --tier rest --jobs 4

      - name: Upload rest smoke attempts and native-window evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-rest-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-results
          if-no-files-found: warn
          retention-days: 30

  # Production add-host wiring over volli-drive's loopback sshd fixture.
  # CI-only: install/start use the disposable macOS runner's launchd and home.
  # Package hostd BEFORE the desktop install can rebuild native dependencies
  # for Electron; the delivered archive must contain the exact .nvmrc Node.
  #
  # After the rest tier, not beside it (one macOS slot at a time), and whatever
  # its outcome: a red rest tier must not hide the cloud result.
  smoke-cloud:
    name: Smoke (cloud acceptance)
    needs: smoke-rest
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # acceptance.json must name the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          run-install: false

      # setup-vp manages pnpm internally; package.mjs calls it by name.
      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          node_bin="$(dirname "$(node -p process.execPath)")"
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          "$node_bin/corepack" enable --install-directory "$RUNNER_TEMP/pnpm-bin" pnpm
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/pnpm-bin:$PATH"
          expected="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          test "$(pnpm --version)" = "$expected"

      - name: Check hostd target and desktop version
        run: |
          set -euo pipefail
          test "$(node -p process.platform)" = darwin
          test "$(node -p process.arch)" = arm64
          test "$(node -p process.versions.node)" = "$(cat .nvmrc)"
          test "$(node -p 'require("./package.json").version')" = "$(node -p 'require("./apps/desktop/package.json").version')"

      - name: Host-only install
        run: pnpm --filter volli-code --filter './packages/*' --filter './apps/hostd' install --frozen-lockfile

      - name: Package hostd and export production install artifact
        run: |
          set -euo pipefail
          node apps/hostd/scripts/package.mjs --out "$RUNNER_TEMP/hostd"
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          tarball="$RUNNER_TEMP/hostd/volli-hostd-$version-darwin-arm64.tar.gz"
          test -f "$tarball"
          test -f "$tarball.sha256"
          echo "VOLLI_HOSTD_DEV_TARBALLS=$tarball" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and fetch Electron
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run flag-on remote acceptance
        env:
          VOLLI_EXPERIMENTAL: cloud
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-acceptance
        run: node apps/desktop/e2e/volli-drive/remote-acceptance-smoke.mjs

      - name: Upload cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-cloud-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The 0.3-C demo, live (VC-895): two isolated volli-drive dev instances,
  # "Mac A" and "Mac B", one person, one throwaway pinned local backend.
  # Mac B watches Mac A's Session, reads "Waiting for <Mac A>" while Mac A
  # sleeps, queues a message, and catches up when it wakes. The sleep is
  # SIMULATED by main's dual-locked smoke seam (real power events, the runner
  # transport held down); the real lid test is on hardware, by the owner.
  #
  # The same job and the same build then prove the Automation path (VC-1004,
  # B3b-6), on a fresh pair of isolated two-Mac instances and a fresh
  # throwaway backend: Mac A arms a column and a schedule on itself, Mac B
  # moves a card into that column and the Run starts on Mac A, Mac A sleeps
  # and B reads the waiting Run, two schedule occurrences coalesce into one
  # skip and one Run, and Mac A waking starts exactly that one Run. Its sleep
  # and its clock are both SIMULATED (the power seam; the fixture backend's
  # guarded `testAutomations` hooks). Sharing this job's loopback-CSP build is
  # what makes the second journey cost the slot rather than a second build.
  #
  # First in the same single-slot chain, for quick cloud wake feedback.
  # The rest tier and remote acceptance still run afterward, even if this
  # fails. Its own build: the renderer CSP must reach the loopback backend
  # (VOLLI_CLOUD_LOOPBACK=1), which release and other lanes never build with.
  smoke-cloud-wake:
    name: Smoke (cloud wake acceptance)
    if: ${{ !cancelled() }}
    runs-on: macos-15
    # Two journeys in one slot: the wake path, then the Automation path.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # acceptance.json must name the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      - name: Build with the loopback CSP and fetch Electron
        env:
          VOLLI_CLOUD_LOOPBACK: "1"
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run the two-Mac wake acceptance (sleep SIMULATED)
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-wake-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-wake-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-wake-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-wake-acceptance-smoke.mjs

      # The second two-Mac journey in the same job: same build, same slot,
      # its own throwaway backend and its own isolated drive homes. It runs
      # whatever the wake journey's outcome was, so one red never hides the
      # other's result; the job fails if either step fails.
      - name: Run the two-Mac Automation acceptance (sleep and clock SIMULATED)
        if: ${{ !cancelled() }}
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-automation-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-automation-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-automation-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-automation-acceptance-smoke.mjs

      - name: Upload two-Mac cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-cloud-wake-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-wake-acceptance
            ${{ runner.temp }}/cloud-automation-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The move engine's kill/resume matrix (Move to Volli Cloud):
  # the engine stopped dead at every step boundary, mid-step and before and
  # after each backend call lands, then resumed by a fresh engine, against
  # the real person-authorized import under convex-test. Linux, no backend
  # process: it holds no macOS slot.
  move-matrix:
    name: Move to Volli Cloud
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true

      - name: Kill/resume matrix
        run: vp run --filter @volli/convex test:matrix -- --maxWorkers=$(nproc)

  # The real desktop move, including the signed-history URL settling window.
  # Runs through volli-drive: a local ticket Session -> move -> Finish -> cloud
  # restart -> moved transcript/attachment -> reuse folders -> resume/new Session.
  move-app:
    name: Move to Volli Cloud (app path)
    if: ${{ !cancelled() }}
    needs: smoke-cloud-wake
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      - name: Build with the loopback CSP and fetch Electron
        env:
          VOLLI_CLOUD_LOOPBACK: "1"
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Drive the real move and cloud handover
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/move-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/move-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/move-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-move-acceptance.mjs

      - name: Upload move app-path evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: move-app-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/move-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The large-profile backup -> restore round trip (VC-988): a synthetic
  # profile of 2,150,000 Session events whose data.json is past 1.6 GB (and
  # past V8's maximum string length), backed up by the production worker,
  # restored with the bounded file restore in its own process, and compared
  # with its source table by table and artifact by artifact. Fails on any
  # count or digest mismatch, or when the restore's peak RSS grows past its
  # budget. Linux, no macOS slot; several GB of scratch disk, removed after.
  backup-restore-rehearsal:
    name: Backup restore rehearsal
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true

      - name: Rehearse a large-profile round trip
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/rehearsal
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          node --experimental-transform-types --disable-warning=ExperimentalWarning \
            packages/host-core/scripts/rehearse-backup-restore.mjs | tee "$RUNNER_TEMP/rehearsal.json"
          {
            echo "### Backup restore rehearsal"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/rehearsal.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One place to read the outcome, on the run page and in its summary. It
  # waits on every lane (`always()`, so a cancelled or failed lane is still
  # reported) and fails unless every lane succeeded — nothing here may skip.
  # Adding a lane means adding it to `needs` and to the list below.
  summary:
    name: Extended result
    if: always()
    needs:
      [smoke-rest, smoke-cloud, smoke-cloud-wake, move-matrix, move-app, backup-restore-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report every lane and require success
        id: report
        shell: bash
        env:
          SMOKE_REST: ${{ needs.smoke-rest.result }}
          SMOKE_CLOUD: ${{ needs.smoke-cloud.result }}
          SMOKE_CLOUD_WAKE: ${{ needs.smoke-cloud-wake.result }}
          MOVE_MATRIX: ${{ needs.move-matrix.result }}
          MOVE_APP: ${{ needs.move-app.result }}
          BACKUP_RESTORE: ${{ needs.backup-restore-rehearsal.result }}
        run: |
          set -euo pipefail
          status=0
          {
            echo "### CI extended (non-gating for PRs; required for release)"
            echo
            echo "| Lane | Result |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          report() {
            echo "| $1 | $2 |" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [[ "$2" == success ]]; then
              echo "ok    $1: $2"
            else
              echo "::error::$1 is '$2', expected 'success'"
              status=1
            fi
          }
          report "Smoke (rest tier)" "$SMOKE_REST"
          report "Smoke (cloud acceptance)" "$SMOKE_CLOUD"
          report "Smoke (cloud wake + automation acceptance)" "$SMOKE_CLOUD_WAKE"
          report "Move to Volli Cloud" "$MOVE_MATRIX"
          report "Move to Volli Cloud (app path)" "$MOVE_APP"
          report "Backup restore rehearsal" "$BACKUP_RESTORE"
          exit "$status"
