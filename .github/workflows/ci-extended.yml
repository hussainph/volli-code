name: CI extended

# The lanes that left the PR gate (VC-934), kept rather than deleted: the rest
# smoke tier (every non-core, non-quarantined journey) and flag-on cloud
# acceptance, plus the move engine's kill/resume matrix, the large-profile
# backup restore rehearsal, the older-app live check (the newest shipped
# build against this commit's backend) and the BYO runner acceptance (all
# Linux). The smoke
# lanes are macOS-only and long, and gating every PR on them held
# all five of the account's concurrent macOS slots per PR run, so PRs queued
# behind each other. Here they run:
#   - on every push to main — the merged tree, after the PR gate;
#   - nightly, so a quiet day still gets a result;
#   - on demand for ANY branch: `gh workflow run ci-extended.yml --ref <branch>`.
#     A PR that changes a journey's area or the cloud path should dispatch it
#     before merge; its result shows on that commit;
#   - on a PR only when it changes this file, the smoke runner, or the
#     older-app live harness, so the lane definition is proven by the PR that
#     edits it (as ci.yml is).
#
# Results are visible, not gating: a red here is a red X on the commit and a
# failed `Extended result`, never a required PR check. The release workflow
# reads it — a commit is released only when this workflow AND CI succeeded on
# it. A red on main is a regression to triage (AGENTS.md, CI is the gate);
# measured repeat flakers belong in smoke-quarantine.yml, not in a re-run.
#
# The rest tier is ONE macOS job, not the three shards it was on PRs, and
# cloud acceptance waits for it rather than running beside it: here latency
# matters less than slots, so this workflow holds one macOS slot at a time
# (main's own core e2e in ci.yml holds a second), leaving the PR lanes three
# of the five. The runner still globs apps/desktop/e2e/*-smoke.mjs and subtracts
# core, credential/legacy exclusions and measured quarantine, so a new smoke
# joins this lane with no registration step. The small two-Mac cloud journey
# leads the chain so its failure reports before the long rest tier: that one
# job proves the wake path and, in the same slot and build, the Automation
# path (VC-1004). Every later lane still runs after a failure, and the summary
# requires all of them.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ci-extended.yml
      - apps/desktop/scripts/run-smokes.mjs
      - apps/desktop/scripts/smoke-quiet-check.mjs
      - scripts/convex-compat/**
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# On main, a RUNNING run is never cancelled — a lane this long, cancelled by
# every merge in a burst, would never report. GitHub keeps at most ONE queued
# run per group and replaces it with the newer commit's (the replaced one
# shows as cancelled on its commit, which the release guard therefore
# refuses), so a burst of merges costs one in-flight run plus one run of the
# newest commit. A PR's newer push does supersede its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-rest:
    name: Smoke (rest tier)
    needs: smoke-cloud-wake
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Build and fetch Electron
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run the rest tier and verify quiet native windows
        env:
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-results
        run: node apps/desktop/scripts/smoke-quiet-check.mjs --assert-stationary-cursor --tier rest --jobs 4

      - name: Upload rest smoke attempts and native-window evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-rest-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-results
          if-no-files-found: warn
          retention-days: 30

  # Production add-host wiring over volli-drive's loopback sshd fixture.
  # CI-only: install/start use the disposable macOS runner's launchd and home.
  # Package hostd BEFORE the desktop install can rebuild native dependencies
  # for Electron; the delivered archive must contain the exact .nvmrc Node.
  #
  # After the rest tier, not beside it (one macOS slot at a time), and whatever
  # its outcome: a red rest tier must not hide the cloud result.
  smoke-cloud:
    name: Smoke (cloud acceptance)
    needs: smoke-rest
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # acceptance.json must name the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          run-install: false

      - name: Check hostd target and desktop version
        run: |
          set -euo pipefail
          test "$(node -p process.platform)" = darwin
          test "$(node -p process.arch)" = arm64
          test "$(node -p process.versions.node)" = "$(cat .nvmrc)"
          test "$(node -p 'require("./package.json").version')" = "$(node -p 'require("./apps/desktop/package.json").version')"

      - name: Host-only install
        run: pnpm --filter volli-code --filter './packages/*' --filter './apps/hostd' install --frozen-lockfile

      - name: Package hostd and export production install artifact
        run: |
          set -euo pipefail
          node apps/hostd/scripts/package.mjs --out "$RUNNER_TEMP/hostd"
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          tarball="$RUNNER_TEMP/hostd/volli-hostd-$version-darwin-arm64.tar.gz"
          test -f "$tarball"
          test -f "$tarball.sha256"
          echo "VOLLI_HOSTD_DEV_TARBALLS=$tarball" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and fetch Electron
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run flag-on remote acceptance
        env:
          VOLLI_EXPERIMENTAL: cloud
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-acceptance
        run: node apps/desktop/e2e/volli-drive/remote-acceptance-smoke.mjs

      - name: Upload cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-cloud-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The 0.3-C demo, live (VC-895): two isolated volli-drive dev instances,
  # "Mac A" and "Mac B", one person, one throwaway pinned local backend.
  # Mac B watches Mac A's Session, reads "Waiting for <Mac A>" while Mac A
  # sleeps, queues a message, and catches up when it wakes. The sleep is
  # SIMULATED by main's dual-locked smoke seam (real power events, the runner
  # transport held down); the real lid test is on hardware, by the owner.
  #
  # The same job and the same build then prove the Automation path (VC-1004,
  # B3b-6), on a fresh pair of isolated two-Mac instances and a fresh
  # throwaway backend: Mac A arms a column and a schedule on itself, Mac B
  # moves a card into that column and the Run starts on Mac A, Mac A sleeps
  # and B reads the waiting Run, two schedule occurrences coalesce into one
  # skip and one Run, and Mac A waking starts exactly that one Run. Its sleep
  # and its clock are both SIMULATED (the power seam; the fixture backend's
  # guarded `testAutomations` hooks). Sharing this job's loopback-CSP build is
  # what makes the second journey cost the slot rather than a second build.
  # A third journey shares it too: BYO-6's runner-setup sheet (VC-1039), one
  # Mac and a SIMULATED Linux box on the real /runner/* wire.
  #
  # First in the same single-slot chain, for quick cloud wake feedback.
  # The rest tier and remote acceptance still run afterward, even if this
  # fails. Its own build: the renderer CSP must reach the loopback backend
  # (VOLLI_CLOUD_LOOPBACK=1), which release and other lanes never build with.
  smoke-cloud-wake:
    name: Smoke (cloud wake acceptance)
    if: ${{ !cancelled() }}
    runs-on: macos-15
    # Three journeys in one slot: the wake path, the Automation path, then
    # the runner-setup sheet.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # acceptance.json must name the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      - name: Build with the loopback CSP and fetch Electron
        env:
          VOLLI_CLOUD_LOOPBACK: "1"
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Run the two-Mac wake acceptance (sleep SIMULATED)
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-wake-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-wake-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-wake-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-wake-acceptance-smoke.mjs

      # The second two-Mac journey in the same job: same build, same slot,
      # its own throwaway backend and its own isolated drive homes. It runs
      # whatever the wake journey's outcome was, so one red never hides the
      # other's result; the job fails if either step fails.
      - name: Run the two-Mac Automation acceptance (sleep and clock SIMULATED)
        if: ${{ !cancelled() }}
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/cloud-automation-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/cloud-automation-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/cloud-automation-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-automation-acceptance-smoke.mjs

      # BYO-6 (VC-1039): Settings → Runners → Add a runner on one Mac, against
      # its own throwaway backend; a SIMULATED Linux box (a Node process on the
      # real /runner/* wire, not a Volli build) spends the token, and the sheet
      # reads "is online". Same build and slot. Until #1107 lands its script,
      # the step says so and passes: there is nothing of it to run yet.
      - name: Run the runner-setup acceptance (Linux box SIMULATED)
        if: ${{ !cancelled() }}
        # Only the scrubbed report is uploaded: the smoke keeps its raw drive
        # home and evidence private by itself.
        env:
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/runner-setup-acceptance
        run: |
          set -euo pipefail
          smoke=apps/desktop/e2e/volli-drive/runner-setup-acceptance-smoke.mjs
          if [[ ! -f "$smoke" ]]; then
            echo "::notice title=Runner-setup acceptance pending::$smoke is not on this tree yet (VC-1039)"
            exit 0
          fi
          node --test apps/desktop/e2e/volli-drive/lib/runner-setup-evidence.test.mjs
          cd convex
          node fixture/with-backend.ts --deploy -- node "../$smoke"

      - name: Upload two-Mac cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-cloud-wake-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-wake-acceptance
            ${{ runner.temp }}/cloud-automation-acceptance
            ${{ runner.temp }}/runner-setup-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The move engine's kill/resume matrix (Move to Volli Cloud):
  # the engine stopped dead at every step boundary, mid-step and before and
  # after each backend call lands, then resumed by a fresh engine, against
  # the real person-authorized import under convex-test. Linux, no backend
  # process: it holds no macOS slot.
  move-matrix:
    name: Move to Volli Cloud
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Kill/resume matrix
        run: vp run --filter @volli/convex test:matrix -- --maxWorkers=$(nproc)

  # The real desktop move, including the signed-history URL settling window.
  # Runs through volli-drive: a local ticket Session -> move -> Finish -> cloud
  # restart -> moved transcript/attachment -> reuse folders -> resume/new Session
  # -> Go back to local, retaining the cloud project and a readable changes export.
  move-app:
    name: Move to Volli Cloud (app path)
    if: ${{ !cancelled() }}
    needs: smoke-cloud-wake
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      - name: Build with the loopback CSP and fetch Electron
        env:
          VOLLI_CLOUD_LOOPBACK: "1"
        run: |
          vp run --filter @volli/desktop build
          vp run --filter @volli/desktop ensure:electron

      - name: Drive the real move and cloud handover
        env:
          VOLLI_DRIVE_HOME: ${{ runner.temp }}/move-drive
          VOLLI_DRIVE_EVIDENCE: ${{ runner.temp }}/move-acceptance
          VOLLI_SMOKE_REPORT_DIR: ${{ runner.temp }}/move-acceptance
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/desktop/e2e/volli-drive/cloud-move-acceptance.mjs

      - name: Upload move app-path evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: move-app-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/move-acceptance
          if-no-files-found: warn
          retention-days: 30

  # The large-profile backup -> restore round trip (VC-988): a synthetic
  # profile of 2,150,000 Session events whose data.json is past 1.6 GB (and
  # past V8's maximum string length), backed up by the production worker,
  # restored with the bounded file restore in its own process, and compared
  # with its source table by table and artifact by artifact. Fails on any
  # count or digest mismatch, or when the restore's peak RSS grows past its
  # budget. Linux, no macOS slot; several GB of scratch disk, removed after.
  backup-restore-rehearsal:
    name: Backup restore rehearsal
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Rehearse a large-profile round trip
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/rehearsal
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          node --experimental-transform-types --disable-warning=ExperimentalWarning \
            packages/host-core/scripts/rehearse-backup-restore.mjs | tee "$RUNNER_TEMP/rehearsal.json"
          {
            echo "### Backup restore rehearsal"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/rehearsal.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The behavioural half of the app↔backend contract (VC-1019): the newest
  # shipped build — the latest `v*` tag by semver, prereleases included, so
  # today `v0.3.0-canary.1` — runs its OWN live cloud suites. Its tree comes
  # out of the tag with `git archive` and its own lockfile is installed, so the
  # suites, every module they import, the `convex` client and the committed
  # `convex/functions/_generated` API are that build's. Only the backend is
  # this commit's: `with-backend.ts --deploy` pushes `convex/functions` to the
  # pinned local backend and hands the run its URL and a test issuer key.
  #
  # The static API guard owns the surface (a function removed, an argument made
  # required, a validator narrowed — each shows up there as a diff); this lane
  # owns what that surface is for — the build people are actually running still
  # signs in, still paints its board, still streams a Session, still reads
  # "Waiting for <Mac>". Neither substitutes for the other: a rename is caught
  # by both, a changed behaviour behind an unchanged signature only here.
  #
  # Linux: these suites are plain Node under `vp test`, and `Convex (codegen +
  # backend)` already runs the same files on ubuntu, so this holds no macOS
  # slot. `fetch-depth: 0` brings the tags the build is chosen from, and the
  # older tree is installed from its own lockfile with `--ignore-scripts` (no
  # Electron download, no node-pty build) into the pnpm store this checkout
  # already filled.
  #
  # `scripts/convex-compat/` is the lane's own harness: one script picks and
  # materializes the build, the other runs its suites under the fixture and
  # refuses any result without evidence — not one test, or a skipped one, is a
  # failure rather than a green. Both report the selected tag, its commit and
  # the suite list to the run's summary, and the JSON report is kept.
  # VC-937: the exact canary.2 legal-version exception in live-exceptions.json
  # requires an extra typed-refusal probe. A labelled current-consent fixture
  # lets all frozen data-plane test bodies run unchanged; no failure is waived.
  # It becomes inactive automatically when a tag newer than canary.2 ships.
  older-app-live:
    name: Older app (live)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags: which build shipped is chosen from them.
          fetch-depth: 0
          persist-credentials: false

      # Bootstrap this commit's backend; prepare installs the tag's own frozen
      # lockfile separately, and its live runner uses that tree's Vite+ binary.
      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      - name: Harness unit tests
        run: node --test scripts/convex-compat/*.test.mjs

      - name: Materialize the newest shipped build
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          node scripts/convex-compat/prepare-older-app.mjs --latest --out "$RUNNER_TEMP/older-app" \
            | tee "$RUNNER_TEMP/older-app-prepare.log"
          # The manifest path is the log's last line; the lines above it name the
          # build chosen (and went to this step's summary already).
          manifest="$(tail -n 1 "$RUNNER_TEMP/older-app-prepare.log")"
          test -f "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Run that build's own live suites against this commit's backend
        working-directory: convex
        env:
          VOLLI_CLOUD_BOARD_LIVE_REQUIRED: "1"
          VOLLI_CLOUD_SESSION_LIVE_REQUIRED: "1"
        run: >-
          node fixture/with-backend.ts --deploy --
          node "$GITHUB_WORKSPACE/scripts/convex-compat/older-app-live.mjs"
          --manifest "${{ steps.prepare.outputs.manifest }}"
          --report "$RUNNER_TEMP/older-app/live-report.json"

      - name: Upload the older-app live evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: older-app-live-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/older-app/live-report.json
            ${{ runner.temp }}/older-app-prepare.log
          if-no-files-found: warn
          retention-days: 30

  # The runner's release artifact, built with release.yml's steps (BYO-7: the
  # bullseye ABI-baseline image, package, boot), once per architecture on a
  # native runner. The install matrix and the BYO lane take it from here. Two
  # deliberate differences from a release: no deployment is baked in (no
  # VOLLI_BUILD_CONVEX_*), so a test artifact links only where `--server`
  # points it and can never reach a real deployment; and the boot accepts the
  # command-registry skeleton (ALLOW_SKELETON), as a dry run does. Until
  # BYO-7's scripts are on the tree, the job says so and builds nothing.
  byo-runner-artifact:
    name: BYO runner artifact (linux-${{ matrix.arch }})
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check the packaging is on this tree
        id: present
        run: |
          if [[ -f apps/runner/scripts/ci-build-artifact.sh && -f .devcontainer/runner-build/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner artifact pending::BYO-7 (VC-1040) packaging is not on this tree yet"
          fi

      - name: Build, package and boot the runner
        if: steps.present.outputs.present == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --file .devcontainer/runner-build/Dockerfile --tag volli-runner-build .
          mkdir -p "$RUNNER_TEMP/runner"
          chmod 0777 "$RUNNER_TEMP/runner"
          docker run --rm -e EXPECTED_ARCH="$ARCH" volli-runner-build sh -ec \
            'test "$(node -p process.arch)" = "$EXPECTED_ARCH"'
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/runner:/out" volli-runner-build \
            bash /src/apps/runner/scripts/ci-build-artifact.sh
          docker run --rm -i -e ALLOW_SKELETON=true -v "$RUNNER_TEMP/runner:/out:ro" volli-runner-build \
            bash -s < apps/runner/scripts/ci-boot-artifact.sh

      - name: Upload the runner artifact
        if: steps.present.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byo-runner-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/runner/*.tar.gz
            ${{ runner.temp }}/runner/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # install.sh across the supported distros (BYO-7's acceptance): both
  # artifacts behind a loopback "release", Ubuntu 20.04/22.04/24.04, Debian
  # 11/12 and Fedora 41, root and user, curl and wget; musl and old glibc
  # refused in one line. Until BYO-10's `install` is on the tree the matrix
  # runs `--bootstrap-only`: download, SHA-256 and the native/Code Mode probes
  # are real, and only the skeleton's exact install stub is accepted after
  # them. Never a claim of a service install.
  byo-install-matrix:
    name: BYO install.sh matrix
    needs: byo-runner-artifact
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Twelve image builds and 26 serial container runs.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check the matrix is on this tree
        id: present
        run: |
          # The artifact job's own gate too: without packaging there is
          # nothing to install, and that is pending, not a failure.
          if [[ -f apps/runner/scripts/ci-install-matrix.sh && -f apps/runner/scripts/ci-build-artifact.sh && -f .devcontainer/runner-build/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Install matrix pending::BYO-7 (VC-1040) ci-install-matrix.sh is not on this tree yet"
          fi
          if [[ -d apps/runner/src/install ]]; then
            echo "mode=" >> "$GITHUB_OUTPUT"
          else
            echo "mode=--bootstrap-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pinned Node
        if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download both runner artifacts
        if: steps.present.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: byo-runner-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/runner-assets

      - name: Run the install.sh matrix
        if: steps.present.outputs.present == 'true'
        env:
          MODE: ${{ steps.present.outputs.mode }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/runner-assets"
          # shellcheck disable=SC2086 # MODE is empty or one flag.
          bash apps/runner/scripts/ci-install-matrix.sh "$RUNNER_TEMP/runner-assets" $MODE

  # BYO runner acceptance (VC-1043): a person's own Linux box, end to end,
  # against the pinned local backend: a seeded person, the fake GitHub
  # (scripts/fake-github: OAuth + REST for the backend, git smart HTTP that
  # checks x-access-token), a local "GitHub release" file server, and a fresh
  # Ubuntu 24.04 box booted under systemd in a privileged container on the
  # host network. Every leg's work is on main, so the lane runs with
  # --require-all: install, update, rollback and the Session leg must each
  # PASS; a leg that fails, or is left PENDING or BLOCKED, is red
  # (apps/runner/e2e/README.md). Linux, no macOS slot.
  byo-runner:
    name: BYO runner acceptance
    needs: byo-runner-artifact
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-toolchain
        with:
          cache: true
          run-install: true

      - name: Place the backend cache outside the checkout
        run: echo "VOLLI_CONVEX_BACKEND_CACHE=$RUNNER_TEMP/convex-local-backend" >> "$GITHUB_ENV"

      - name: Restore the pinned Convex local backend
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('convex/fixture/backend.json') }}

      - name: Fetch and verify the pinned backend
        run: vp run --filter @volli/convex backend:fetch

      # Both runner artifacts for the install leg's local release (a C4
      # manifest names both targets; the box installs x64). Not on this tree
      # yet (BYO-7) is a notice; on the tree but not built is red.
      - name: Check the packaging is on this tree
        id: present
        run: |
          if [[ -f apps/runner/scripts/ci-build-artifact.sh && -f .devcontainer/runner-build/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner artifact pending::BYO-7 (VC-1040) packaging is not on this tree yet"
          fi

      - name: Download both runner artifacts
        if: steps.present.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: byo-runner-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/runner-assets

      # The fake GitHub's name (a runner refuses a loopback literal as a
      # remote). The box adds the same line to its own /etc/hosts.
      - name: Map github.byo.test to the loopback
        run: echo "127.0.0.1 github.byo.test" | sudo tee -a /etc/hosts

      - name: Harness self-tests (fake GitHub, release server, legs)
        run: node --test scripts/fake-github/*.test.mjs apps/runner/e2e/lib/*.test.mjs

      - name: Run the BYO runner acceptance
        env:
          VOLLI_BYO_EVIDENCE: ${{ runner.temp }}/byo-acceptance
          VOLLI_BYO_RUNNER_ASSETS: ${{ runner.temp }}/runner-assets
        working-directory: convex
        run: >-
          node fixture/with-backend.ts --deploy --
          node ../apps/runner/e2e/acceptance.mjs --require-all

      - name: Upload BYO runner acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byo-runner-acceptance-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/byo-acceptance
          if-no-files-found: warn
          retention-days: 30

  # One place to read the outcome, on the run page and in its summary. It
  # waits on every lane (`always()`, so a cancelled or failed lane is still
  # reported) and fails unless every lane succeeded — nothing here may skip.
  # Adding a lane means adding it to `needs` and to the list below.
  summary:
    name: Extended result
    if: always()
    needs:
      [
        smoke-rest,
        smoke-cloud,
        smoke-cloud-wake,
        move-matrix,
        move-app,
        backup-restore-rehearsal,
        older-app-live,
        byo-runner-artifact,
        byo-install-matrix,
        byo-runner,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report every lane and require success
        id: report
        shell: bash
        env:
          SMOKE_REST: ${{ needs.smoke-rest.result }}
          SMOKE_CLOUD: ${{ needs.smoke-cloud.result }}
          SMOKE_CLOUD_WAKE: ${{ needs.smoke-cloud-wake.result }}
          MOVE_MATRIX: ${{ needs.move-matrix.result }}
          MOVE_APP: ${{ needs.move-app.result }}
          BACKUP_RESTORE: ${{ needs.backup-restore-rehearsal.result }}
          OLDER_APP_LIVE: ${{ needs.older-app-live.result }}
          BYO_RUNNER_ARTIFACT: ${{ needs.byo-runner-artifact.result }}
          BYO_INSTALL_MATRIX: ${{ needs.byo-install-matrix.result }}
          BYO_RUNNER: ${{ needs.byo-runner.result }}
        run: |
          set -euo pipefail
          status=0
          {
            echo "### CI extended (non-gating for PRs; required for release)"
            echo
            echo "| Lane | Result |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          report() {
            echo "| $1 | $2 |" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [[ "$2" == success ]]; then
              echo "ok    $1: $2"
            else
              echo "::error::$1 is '$2', expected 'success'"
              status=1
            fi
          }
          report "Smoke (rest tier)" "$SMOKE_REST"
          report "Smoke (cloud acceptance)" "$SMOKE_CLOUD"
          report "Smoke (cloud wake + automation acceptance)" "$SMOKE_CLOUD_WAKE"
          report "Move to Volli Cloud" "$MOVE_MATRIX"
          report "Move to Volli Cloud (app path)" "$MOVE_APP"
          report "Backup restore rehearsal" "$BACKUP_RESTORE"
          report "Older app (live)" "$OLDER_APP_LIVE"
          report "BYO runner artifact" "$BYO_RUNNER_ARTIFACT"
          report "BYO install.sh matrix" "$BYO_INSTALL_MATRIX"
          report "BYO runner acceptance" "$BYO_RUNNER"
          exit "$status"
